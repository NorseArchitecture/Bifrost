# Compose mode exists for one reason: it's the only way to name the image.
# The image/Dockerfile paths both bake features into vsc-bifrost-<64-char-hash>-features;
# here the tag below is the final name, features and all.
name: bifrost

services:
  bifrost:
    image: vsc-bifrost
    container_name: bifrost
    build:
      context: .
      dockerfile: Dockerfile
    # No long-running process in the base image, and the dev container has to outlive
    # the build. docker-in-docker's entrypoint is layered in front of this automatically.
    command: sleep infinity
    volumes:
      # Mounts the whole NorseArchitecture org folder (Bifrost's parent on the host), not
      # just Bifrost itself — .github (Ginnungagap) and Glitnir sit as host-level siblings
      # to Bifrost and are referenced by sibling-relative path from realm CLAUDE.md files;
      # they need to actually be on disk in the container for those paths to resolve.
      # devcontainer.json's workspaceFolder still points at the nested Bifrost subdirectory,
      # so VS Code/terminal cwd and Claude Code's project-root resolution are unaffected.
      - ../..:/workspaces/NorseArchitecture:cached
      # Prior art, read-only. Peer to NorseArchitecture on the host, not part of it — kept
      # readable-but-not-writable at both layers: the :ro mount is the real enforcement,
      # and .claude/settings.json's Edit/Write deny rules make Claude refuse before ever
      # hitting it, instead of surfacing an OS-level I/O error.
      - ../../../PriorArt:/workspaces/PriorArt:ro
      # Declared external so it stays plain `norse-home` instead of compose scoping it to
      # `bifrost_norse-home`. The whole home directory, one durable volume: nuget/npm
      # caches, the dotnet dev-certs store (see scripts/Trust-DevCert.ps1 — losing this
      # volume mints a new cert fingerprint and re-triggers the one-time Windows trust
      # step), and every CLI's own auth state (gh, claude, codex) all live under here, so
      # none of it needs calling out by path individually or re-authenticating on rebuild.
      - norse-home:/home/vscode

volumes:
  norse-home:
    external: true
